<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação enviada | JCP Engenharia e Projetos</title>
<meta name="description" content="Recebemos sua solicitação. A JCP Engenharia e Projetos entrará em contato em breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1116;
    --blueprint:#0F2340;
    --blueprint-2:#173156;
    --paper:#F6F4EF;
    --paper-line:#E4E0D5;
    --steel:#4C5F73;
    --amber:#E8A73A;
    --amber-dark:#C4881F;
    --white:#FFFFFF;
    --max:1120px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Archivo',sans-serif;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(246,244,239,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--paper-line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:var(--max);margin:0 auto;}
  .logo{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.15rem;color:var(--blueprint);display:flex;align-items:center;gap:10px;}
  .logo .mark{width:30px;height:30px;flex-shrink:0;}
  .nav-links{display:flex;align-items:center;gap:32px;}
  .nav-links a{font-size:0.95rem;font-weight:500;color:var(--steel);}
  .nav-links a:hover{color:var(--blueprint);}
  .nav-cta{background:var(--blueprint);color:var(--white) !important;padding:10px 20px;border-radius:3px;font-weight:600 !important;font-size:0.92rem !important;}
  .nav-cta:hover{background:var(--blueprint-2);}
  .menu-btn{display:none;}
  @media (max-width:820px){
    .nav-links{position:fixed;inset:64px 0 0 0;background:var(--paper);flex-direction:column;justify-content:flex-start;padding:32px 28px;gap:24px;transform:translateX(100%);transition:transform .25s ease;}
    .nav-links.open{transform:translateX(0);}
    .menu-btn{display:block;background:none;border:none;cursor:pointer;padding:6px;}
    .menu-btn svg{width:24px;height:24px;color:var(--blueprint);}
  }

  .confirm{
    background:var(--blueprint);
    color:var(--white);
    min-height:calc(100vh - 73px);
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    padding:80px 0;
  }
  .confirm::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:44px 44px;
    pointer-events:none;
  }
  .confirm .wrap{position:relative;max-width:640px;}
  .check-icon{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
  }
  .check-icon svg{width:28px;height:28px;color:var(--blueprint);}
  .confirm h1{
    font-size:clamp(1.8rem, 3.6vw, 2.4rem);
    font-weight:800;
    color:var(--white);
    line-height:1.2;
  }
  .confirm p{
    margin-top:18px;
    color:#C9D3E0;
    font-size:1.08rem;
    line-height:1.6;
    max-width:52ch;
  }
  .confirm-actions{
    margin-top:34px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }
  .btn-primary{
    background:var(--amber);
    color:var(--ink);
    padding:13px 24px;
    border-radius:3px;
    font-weight:600;
    font-size:0.95rem;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:background .15s ease;
  }
  .btn-primary:hover{background:var(--amber-dark);}
  .btn-secondary{
    border:1px solid rgba(255,255,255,0.3);
    color:var(--white);
    padding:13px 24px;
    border-radius:3px;
    font-weight:600;
    font-size:0.95rem;
  }
  .btn-secondary:hover{background:rgba(255,255,255,0.08);}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="3" fill="#0F2340"/>
        <path d="M18 6 L10 18 H15 L13 26 L23 12 H17.5 L18 6Z" fill="#E8A73A"/>
      </svg>
      JCP Engenharia
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#servicos">Serviços</a>
      <a href="index.html#normas">Normas</a>
      <a href="index.html#sobre">Sobre</a>
      <a href="contato.html">Contato</a>
      <a href="https://wa.me/5511915718243?text=Ol%C3%A1!%20Gostaria%20de%20solicitar%20um%20or%C3%A7amento." class="nav-cta">Falar com engenheiro</a>
    </nav>
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="confirm">
    <div class="wrap">
      <div class="check-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1>Solicitação recebida</h1>
      <p>Obrigado pelo contato. Nossa equipe vai analisar as informações enviadas e retornar em até 1 dia útil com uma avaliação técnica inicial.</p>
      <div class="confirm-actions">
        <a class="btn-primary" href="https://wa.me/5511915718243?text=Ol%C3%A1!%20Acabei%20de%20enviar%20uma%20solicita%C3%A7%C3%A3o%20pelo%20site.">
          Falar agora pelo WhatsApp
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a class="btn-secondary" href="index.html">Voltar ao início</a>
      </div>
    </div>
  </section>
</main>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const navLinks = document.getElementById('navLinks');
  menuBtn.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', isOpen);
  });
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    navLinks.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', false);
  }));
</script>

</body>
</html>
