<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <!-- White and Golden Amber variant for dark backgrounds -->
  <g fill="#FFFFFF" stroke="#FFFFFF">
    <!-- "JCP" Monogram Typography -->
    <text 
      x="25" 
      y="136" 
      font-family="'Montserrat', 'Arial Black', 'Nimbus Sans', sans-serif" 
      font-size="134" 
      font-weight="900" 
      letter-spacing="-1" 
      stroke="none"
    >JCP</text>

    <!-- Subtitle: "ENGENHARIA E PROJETOS" -->
    <text 
      x="26" 
      y="166" 
      font-family="'Montserrat', 'Arial', sans-serif" 
      font-size="20.5" 
      font-weight="800" 
      letter-spacing="2.8" 
      stroke="none"
      fill="#38BDF8"
    >ENGENHARIA E PROJETOS</text>

    <!-- Right Energy Symbol -->
    <g transform="translate(425, 96)">
      <!-- Upper-Left Circular Arc -->
      <path 
        d="M 17 -62 A 64 64 0 0 0 -48 43" 
        fill="none" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke="#F8FAFC"
      />

      <!-- Lower-Right Circular Arc -->
      <path 
        d="M -17 62 A 64 64 0 0 0 48 -43" 
        fill="none" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke="#F8FAFC"
      />

      <!-- Main High-Voltage Lightning Bolt in Amber -->
      <polygon 
        points="46,-92 7,-8 40,-8 -24,96 14,8 -19,8" 
        fill="#F59E0B"
        stroke="none"
      />

      <!-- Dynamic Top-Right Accent Spike -->
      <polygon 
        points="46,-92 34,-35 40,-33 45,-65" 
        fill="#F59E0B"
        stroke="none"
      />

      <!-- Dynamic Bottom-Left Accent Spike -->
      <polygon 
        points="-24,96 -12,35 -18,33 -23,65" 
        fill="#F59E0B"
        stroke="none"
      />
    </g>
  </g>
</svg>
